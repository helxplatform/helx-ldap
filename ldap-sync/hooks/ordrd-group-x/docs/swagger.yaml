basePath: /
definitions:
  main.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  main.HookRequest:
    properties:
      content:
        additionalProperties: true
        description: |-
          Attributes of the entry
          required: true
        type: object
      dn:
        description: |-
          Distinguished Name of the LDAP entry
          required: true
        type: string
    type: object
  main.HookResponse:
    properties:
      dependencies:
        items:
          type: string
        type: array
      derived:
        items:
          $ref: '#/definitions/main.SearchSpec'
        type: array
      transformed:
        $ref: '#/definitions/main.TransformedEntry'
    type: object
  main.SearchSpec:
    properties:
      baseDN:
        type: string
      filter:
        type: string
      id:
        type: string
      oneshot:
        type: boolean
      refresh:
        type: integer
    type: object
  main.TransformedEntry:
    properties:
      content:
        additionalProperties: true
        type: object
      dn:
        type: string
    type: object
host: localhost:5001
info:
  contact: {}
  description: LDAP synchronization hook for ordrd-group-x
  title: Hook Service
  version: 2.0.0
paths:
  /hook:
    post:
      consumes:
      - application/json
      description: Transform LDAP entries, derive searches, declare dependencies
      parameters:
      - description: Hook payload
        in: body
        name: hook
        required: true
        schema:
          $ref: '#/definitions/main.HookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: Process LDAP hook
swagger: "2.0"
