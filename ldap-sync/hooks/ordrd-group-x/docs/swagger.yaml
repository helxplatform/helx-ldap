basePath: /
definitions:
  main.Entry:
    properties:
      content:
        additionalProperties: true
        type: object
      dn:
        type: string
    type: object
  main.HookRequest:
    properties:
      content:
        additionalProperties: true
        type: object
      dn:
        type: string
    required:
    - content
    - dn
    type: object
  main.HookResponse:
    properties:
      dependencies:
        items:
          type: string
        type: array
      derived:
        items:
          $ref: '#/definitions/main.SearchSpec'
        type: array
      transformed:
        $ref: '#/definitions/main.Entry'
    type: object
  main.SearchSpec:
    properties:
      baseDN:
        type: string
      filter:
        type: string
      id:
        type: string
      oneshot:
        type: boolean
      refresh:
        type: integer
    type: object
host: localhost:5001
info:
  contact: {}
  description: Processes LDAP hook payloads and emits transformed, derived, and dependency
    data.
  title: ordrd-group-x Hook Service API
  version: 2.0.0
paths:
  /hook:
    post:
      consumes:
      - application/json
      description: Transform LDAP entries and generate derived searches + dependencies
      parameters:
      - description: Hook payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/main.HookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.HookResponse'
            type: array
      summary: Process LDAP hook
swagger: "2.0"
